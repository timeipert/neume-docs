name: CI and Pages

# Every push and pull request is tested and built. A push to main is also published:
# the built app, with its manual, goes to GitHub Pages at https://neumedocs.monodi.app
# (the address is set in the repository's Pages settings and in the CNAME file).

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer run of the same branch makes an older one pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            ui/package-lock.json
            user-manual/package-lock.json

      - name: Install the app's dependencies
        working-directory: ./ui
        run: npm ci

      - name: Run tests
        working-directory: ./ui
        run: npm test

      # The manual is part of the site (the app links to /manual/): build it first, into ui/public.
      - name: Install the manual's dependencies
        working-directory: ./user-manual
        run: npm ci

      - name: Build the manual
        run: npm run build:manual

      # Signing in to GitHub is set up with repository variables (auth-proxy/README.md); without them the
      # site builds and the panel says it is not set up.
      - name: Build the app
        working-directory: ./ui
        env:
          VITE_GITHUB_CLIENT_ID: ${{ vars.VITE_GITHUB_CLIENT_ID }}
          VITE_AUTH_PROXY_URL: ${{ vars.VITE_AUTH_PROXY_URL }}
          VITE_GITHUB_APP_URL: ${{ vars.VITE_GITHUB_APP_URL }}
        run: npm run build

      # Pages deployed by a workflow takes the address from its settings; the file keeps the
      # site's address with the site, wherever it is copied to.
      - name: Name the domain
        run: cp CNAME dist/CNAME

      - name: Upload the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: test-and-build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
